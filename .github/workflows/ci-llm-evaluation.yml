name: LLM Evaluation Pipeline

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  evaluate:
    name: Run LLM Evaluation
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'run-eval') ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '/run-eval' && github.event.issue.pull_request)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: chatbot-core/requirements.txt

      - name: Install dependencies
        working-directory: chatbot-core
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock deepeval openai
          pip install -r requirements.txt

      - name: Validate Golden Dataset
        working-directory: chatbot-core
        env:
          PYTHONPATH: ${{ github.workspace }}/chatbot-core
        run: |
          pytest evaluation/runner.py::TestDatasetValidation -v

      - name: Run LLM Evaluation
        working-directory: chatbot-core
        env:
          PYTHONPATH: ${{ github.workspace }}/chatbot-core
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_RANDOM_SEED: "42"
        run: |
          pytest evaluation/runner.py::TestLLMEvaluation -v --tb=short

      - name: Generate Report
        if: always()
        working-directory: chatbot-core
        env:
          PYTHONPATH: ${{ github.workspace }}/chatbot-core
          EVAL_MOCK_MODE: "true"
        run: |
          pytest evaluation/runner.py::TestEvaluationReport -v || true

      - name: Post Results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'chatbot-core/evaluation/evaluation_report.md';
            
            let report = '## 📊 LLM Evaluation Results\n\n';
            
            if (fs.existsSync(path)) {
              report = fs.readFileSync(path, 'utf8');
            } else {
              report += '⚠️ Report generation failed. Check workflow logs for details.';
            }
            
            const prNumber = context.payload.pull_request?.number || 
                           context.payload.issue?.number;
            
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: report
              });
            }

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            chatbot-core/evaluation/evaluation_report.md
          retention-days: 30
